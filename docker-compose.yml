services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: ci4_app
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ci4_network

  webserver:
    image: nginx:alpine
    container_name: ci4_webserver
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ci4_network

  db:
    image: mysql:8.0
    container_name: ci4_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ci4_blog
      MYSQL_USER: ci4_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - ci4_network

networks:
  ci4_network:
    driver: bridge

volumes:
  db_data: